[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-os"
version = "0.1.0"
description = "Sentinel Operating System"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Vishnu Vardhan Reddy" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.12",
    "mypy>=1.17",
]

# -------------------------------------------------------------------
# Pytest
# -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
]

# -------------------------------------------------------------------
# Coverage
# -------------------------------------------------------------------

[tool.coverage.run]
source = [
    "sentinel",
]

branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

# -------------------------------------------------------------------
# Ruff
# -------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

# -------------------------------------------------------------------
# MyPy
# -------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

disallow_untyped_defs = true

no_implicit_optional = true

# -------------------------------------------------------------------
# Setuptools
# -------------------------------------------------------------------

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sentinel*"]
exclude = [
    "tests*",
    "docs*",
    "examples*",
    "configs*",
    "logs*",
    "tools*",
    "scripts*",
]